name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Web App
        run: npm run build

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        run: |
          echo "=== ANDROID_HOME: $ANDROID_HOME ==="
          
          # Find sdkmanager location
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -f "$SDKMANAGER" ]; then
            echo "sdkmanager not at cmdline-tools/latest, searching..."
            SDKMANAGER=$(find "$ANDROID_HOME" -name "sdkmanager" -type f 2>/dev/null | head -1)
          fi
          echo "=== Using sdkmanager: $SDKMANAGER ==="
          
          # Accept licenses  
          yes | "$SDKMANAGER" --licenses 2>&1 || true
          
          # Try installing platforms - with verbose output
          echo "=== Installing Android SDK platform 36 ==="
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" 2>&1 || {
            echo "=== API 36 failed, trying API 35 ==="
            "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.1" 2>&1 || {
              echo "=== API 35 failed, trying API 34 ==="
              "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" 2>&1
            }
          }
          
          echo "=== Installed platforms: ==="
          ls -la "$ANDROID_HOME/platforms/" || true
          echo "=== Installed build-tools: ==="
          ls -la "$ANDROID_HOME/build-tools/" || true

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle executable
        run: chmod +x ./android/gradlew

      - name: Build APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Committee-App-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
