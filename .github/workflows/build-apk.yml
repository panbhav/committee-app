name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Web App
        run: npm run build

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME" -name "sdkmanager" -type f 2>/dev/null | head -1)
          fi
          yes | "$SDKMANAGER" --licenses 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" 2>&1 || \
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" 2>&1 || true

      - name: Copy Web Assets to Android
        run: |
          # Do what cap sync does - copy dist to android assets
          rm -rf android/app/src/main/assets/public
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/
          
          # Generate capacitor.config.json in assets
          cp capacitor.config.json android/app/src/main/assets/capacitor.config.json
          
          # Generate empty capacitor.plugins.json if not exists
          echo '[]' > android/app/src/main/assets/capacitor.plugins.json
          
          # Generate cordova files for compatibility
          echo '// placeholder' > android/app/src/main/assets/public/cordova.js
          echo 'cordova.define("cordova/plugin_list", function(require, exports, module) { module.exports = []; });' > android/app/src/main/assets/public/cordova_plugins.js
          
          # Create capacitor-cordova-android-plugins if not exists
          mkdir -p android/capacitor-cordova-android-plugins/src/main/java
          mkdir -p android/capacitor-cordova-android-plugins/src/main/res
          
          # Create build.gradle for cordova plugins module if not exists
          if [ ! -f android/capacitor-cordova-android-plugins/build.gradle ]; then
            cat > android/capacitor-cordova-android-plugins/build.gradle << 'GRADLE'
          apply plugin: 'com.android.library'

          android {
              namespace "capacitor.cordova.android.plugins"
              compileSdkVersion project.hasProperty('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 36
              defaultConfig {
                  minSdkVersion project.hasProperty('minSdkVersion') ? rootProject.ext.minSdkVersion : 24
                  targetSdkVersion project.hasProperty('targetSdkVersion') ? rootProject.ext.targetSdkVersion : 36
              }
              lintOptions {
                  abortOnError false
              }
          }
          GRADLE
          fi
          
          # Create cordova.variables.gradle if not exists
          if [ ! -f android/capacitor-cordova-android-plugins/cordova.variables.gradle ]; then
            echo 'ext {}' > android/capacitor-cordova-android-plugins/cordova.variables.gradle
          fi
          
          # Create AndroidManifest.xml for cordova plugins if not exists
          if [ ! -f android/capacitor-cordova-android-plugins/src/main/AndroidManifest.xml ]; then
            echo '<?xml version="1.0" encoding="utf-8"?><manifest xmlns:android="http://schemas.android.com/apk/res/android"></manifest>' > android/capacitor-cordova-android-plugins/src/main/AndroidManifest.xml
          fi
          
          # Generate config.xml for Capacitor
          mkdir -p android/app/src/main/res/xml
          cat > android/app/src/main/res/xml/config.xml << 'XML'
          <?xml version='1.0' encoding='utf-8'?>
          <widget version="1.0.0" xmlns="http://www.w3.org/ns/widgets" xmlns:cdv="http://cordova.apache.org/ns/1.0">
              <access origin="*" />
          </widget>
          XML
          
          echo "=== Web assets copied successfully ==="
          ls -la android/app/src/main/assets/public/ | head -10

      - name: Make Gradle executable
        run: chmod +x ./android/gradlew

      - name: Build APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace 2>&1

      - name: Rename APK for Distribution
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/Banking-Society.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Banking-Society-APK
          path: android/app/build/outputs/apk/debug/Banking-Society.apk

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Banking Society APK v1.0.${{ github.run_number }}"
          make_latest: true
          body: |
            ### 📱 Banking Society Mobile App (Android APK)
            Latest standalone Android APK with all current features, verified calculations, and clean financial audit logs.
            
            **Direct Download:** [Banking-Society.apk](https://github.com/panbhav/committee-app/releases/latest/download/Banking-Society.apk)
          files: android/app/build/outputs/apk/debug/Banking-Society.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
